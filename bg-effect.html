<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BG Effect</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%;
      height: 100%;
    }

    .bg {
      width: 100%;
      height: 100vh;
      background-color: #1a0a0a;
      position: relative;
    }

    .bg::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        linear-gradient(to bottom, rgba(0,0,0,0.95) 0%, transparent 52%),
        linear-gradient(to top,    rgba(0,0,0,0.95) 0%, transparent 52%);
    }
  </style>
</head>
<body>
  <div class="bg"></div>
</body>
</html>
