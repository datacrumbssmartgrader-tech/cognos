<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Welcome to Burgerz</title>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&family=Lilita+One&display=swap" rel="stylesheet" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            fredoka: ['Fredoka One', 'cursive'],
            lilita:  ['Lilita One',  'cursive'],
          }
        }
      }
    }
  </script>
  <style>
    .sunburst {
      background-color: #CC0000;
      background-image: repeating-conic-gradient(
        rgba(255,255,255,0.09) 0deg 9deg,
        transparent 9deg 18deg
      );
    }
    .heading-fx {
      -webkit-text-stroke: 2.5px rgba(0,0,0,0.15);
      text-shadow: 0 4px 0 rgba(0,0,0,0.22), 0 6px 18px rgba(0,0,0,0.18);
    }
  </style>
</head>
<body class="sunburst min-h-screen">

  <div class="relative w-full max-w-[393px] min-h-screen mx-auto flex flex-col items-center overflow-hidden">

    <!-- Table badge -->
    <span id="table-badge"
      class="absolute top-[18px] left-[18px] z-10 bg-[#f2d3be] border-[2.5px] border-[#69160e] text-[#69160e] rounded-full px-5 py-1.5 font-fredoka text-[0.95rem] tracking-wide">
      Table: 05
    </span>

    <!-- Heading -->
    <h1 class="heading-fx mt-16 font-lilita text-[clamp(2.4rem,11vw,3.2rem)] leading-[1.08] text-white text-center tracking-[0.01em] px-5 z-[2]">
      WELCOME TO<br>BURGERZ
    </h1>

    <!-- Burger hero — tight margins to close the gap -->
    <div class="w-full flex items-center justify-center mt-1">
      <img
        src="images/landing/bg-removebg-preview.png"
        alt="Burger"
        class="w-[94%] max-w-[340px] object-contain drop-shadow-[0_16px_40px_rgba(0,0,0,0.4)]"
      />
    </div>

    <!-- Buttons pushed to bottom -->
    <div class="mt-auto w-full px-7 pb-12 flex flex-col gap-3.5">
      <button onclick="goMenu()"
        class="w-full rounded-full py-4 font-fredoka text-xl text-white tracking-[0.02em] cursor-pointer transition-all duration-150 active:opacity-80 active:scale-[0.975] bg-[#bc0301] border-[2.5px] border-white/50 shadow-[0_3px_14px_rgba(0,0,0,0.35)]">
        Menu
      </button>
      <button onclick="callWaiter()"
        class="w-full rounded-full py-4 font-fredoka text-xl text-white tracking-[0.02em] cursor-pointer transition-all duration-150 active:opacity-80 active:scale-[0.975] bg-[#f8ac01] border-[2.5px] border-white/40 shadow-[0_3px_14px_rgba(0,0,0,0.25)]">
        Call Waiter
      </button>
    </div>

  </div>

  <script>
    var t = new URLSearchParams(window.location.search).get('table') || '05';
    document.getElementById('table-badge').textContent = 'Table: ' + t;

    function goMenu() {
      window.location.href = 'project/dine.html?table=' + t;
    }
    function callWaiter() {
      alert('Waiter has been called for Table ' + t + '!');
    }
  </script>

</body>
</html>
